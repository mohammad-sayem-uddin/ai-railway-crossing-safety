schema_version: 2.0.0
generator: scripts/classify_test_access.py
method: Each file run alone under railway_detection.safety.access_guard_plugin, which blocks reads of
  raw media, model weights, processed data and results and records every attempt; plus an AST scan for
  protected-path literals and child-process calls.
categories_definition:
  SYNTHETIC_ONLY: Observed to read nothing in the repository except source/test code; every data file
    it touches is created in a temporary directory.
  METADATA_ONLY: Observed to read repository metadata (configs, docs, ground-truth / manifest / governance
    JSON) but no media, model weights, processed data or results.
  MODEL_CHECKPOINT_ACCESS: Attempted to read model weights (blocked by the guard when classified).
  PROCESSED_DATA_ACCESS: Attempted to read processed data, caches, results or experiment artifacts (blocked
    by the guard when classified).
  RAW_MEDIA_ACCESS: Attempted to read raw media or a media-suffixed repository file (blocked by the guard
    when classified).
  UNKNOWN: Access could not be established (collection error, timeout, spawned child process, or no test
    executed). Treated as unsafe.
limitations:
- 'Python-level guard only: native code that opens files without builtins.open, io.open, os.open, os.scandir/listdir,
  subprocess arguments or cv2.VideoCapture is not observed.'
- A test that fails early on its first blocked read may hide later reads; the category is still at least
  what was observed. Re-run the generator after any test change.
- The classification is bound to each file's SHA-256; a changed file is STALE and not run.
- Reads performed by the repository's tests/conftest.py registry fingerprint are exempt (results/experiment_registry.jsonl,
  a text run-log).
- Mission22 inventories new/changed test files conservatively as UNKNOWN, with zero invented classifier
  test counts; its complete regression command still executes every file under a separate inherited access
  policy.
- Mission22 inventories new/changed test files conservatively as UNKNOWN, with zero invented classifier
  test counts; its complete regression command still executes every file under a separate inherited access
  policy.
