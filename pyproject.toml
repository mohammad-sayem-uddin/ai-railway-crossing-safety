[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "railway-detection"
version = "0.1.0"
description = "Research software foundation for multimodal railway-crossing train detection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary research prototype" }
dependencies = [
    "numpy>=1.26",
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "ultralytics>=8.0.0",
    "opencv-python>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
eval = [
    "matplotlib>=3.8",
    "scipy>=1.10.0",
]

[project.scripts]
railway-detection = "railway_detection.cli.main:main"
railway-readiness = "railway_detection.annotation.readiness_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
norecursedirs = [".venv", "venv", "data", "experiments", "models", "results"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Runtime targets >=3.11; 3.12 is the minimum that parses modern numpy stubs.
python_version = "3.12"
mypy_path = "src"
files = ["src"]
check_untyped_defs = true
